<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生出勤签到系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-dark">
    <!-- 主容器 -->
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 导航栏 -->
        <nav class="flex justify-between items-center mb-10">
            <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-primary">
                <i class="fa fa-calendar-check-o mr-2"></i>学生出勤签到系统
            </h1>
            <div class="flex gap-3">
                <button id="studentBtn" class="px-5 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all">
                    <i class="fa fa-user mr-1"></i>学生签到
                </button>
                <button id="adminBtn" class="px-5 py-2 bg-dark text-white rounded-lg hover:bg-dark/90 transition-all">
                    <i class="fa fa-cog mr-1"></i>后台管理
                </button>
            </div>
        </nav>

        <!-- 学生签到页面 -->
        <div id="studentPage" class="page">
            <div class="bg-white rounded-xl p-8 card-shadow">
                <h2 class="text-2xl font-bold mb-6 text-center">学生签到</h2>
                
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">请输入你的学号</label>
                    <input type="text" id="studentId" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus" placeholder="请输入管理员分配的学号">
                </div>

                <div id="studentNameDisplay" class="hidden mb-6 p-3 bg-blue-50 rounded-lg text-primary font-medium transition-all">
                    <i class="fa fa-user-circle mr-2"></i>你的姓名：<span id="showName"></span>
                </div>

                <div id="passwordSection" class="hidden mb-6 transition-all">
                    <label class="block text-gray-700 mb-2" id="passwordLabel">请输入6位数字密码确认签到</label>
                    <input type="password" id="studentPassword" maxlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus" placeholder="请输入6位数字密码">
                </div>

                <button id="signInBtn" class="w-full py-3 bg-success text-white rounded-lg hover:bg-success/90 transition-all text-lg font-medium">
                    <i class="fa fa-check-circle mr-2"></i>确认签到
                </button>

                <div id="signInResult" class="mt-6 p-4 rounded-lg hidden transition-all"></div>
            </div>
        </div>

        <!-- 管理员登录页面 -->
        <div id="adminLoginPage" class="page hidden">
            <div class="bg-white rounded-xl p-8 card-shadow max-w-md mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-center">管理员登录</h2>
                
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2">请输入管理员密码</label>
                    <input type="password" id="adminPassword" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus" placeholder="请输入管理员密码">
                </div>

                <button id="adminLoginBtn" class="w-full py-3 bg-dark text-white rounded-lg hover:bg-dark/90 transition-all text-lg font-medium">
                    <i class="fa fa-lock mr-2"></i>登录后台
                </button>

                <div id="loginResult" class="mt-6 p-4 rounded-lg hidden"></div>
            </div>
        </div>

        <!-- 后台管理页面 -->
        <div id="adminPage" class="page hidden">
            <div class="bg-white rounded-xl p-6 card-shadow mb-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">出勤记录管理</h2>
                    <div class="flex items-center gap-3">
                        <button id="prevMonth" class="p-2 bg-gray-100 rounded-lg hover:bg-gray-200">
                            <i class="fa fa-chevron-left"></i>
                        </button>
                        <span id="currentMonthDisplay" class="text-lg font-medium"></span>
                        <button id="nextMonth" class="p-2 bg-gray-100 rounded-lg hover:bg-gray-200">
                            <i class="fa fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <h3 class="font-bold mb-3 text-dark">添加学生信息</h3>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="newStudentId" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg input-focus" placeholder="输入学生学号">
                        <input type="text" id="newStudentName" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg input-focus" placeholder="输入学生姓名">
                        <button id="addStudentBtn" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 font-medium shadow-sm">
                            添加
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">* 学号唯一，添加后学生方可使用该学号签到</p>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-left">
                                <th class="p-3 border-b">学号</th>
                                <th class="p-3 border-b">姓名</th>
                                <th class="p-3 border-b">签到状态</th>
                                <th class="p-3 border-b">签到时间</th>
                                <th class="p-3 border-b">操作</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <!-- 数据将通过JS动态渲染 -->
                        </tbody>
                    </table>
                </div>
                
                <div id="emptyState" class="hidden text-center py-8 text-gray-500">
                    <i class="fa fa-inbox text-4xl mb-2"></i>
                    <p>暂无学生数据，请在上方添加</p>
                </div>

                <div class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div>
                        <span class="text-gray-600">本月已签到: <span id="signedCount" class="font-bold text-primary">0</span></span>
                        <span class="ml-4 text-gray-600">总人数: <span id="totalCount" class="font-bold">0</span></span>
                    </div>
                    <button id="resetMonthBtn" class="px-4 py-2 bg-warning text-white rounded-lg hover:bg-warning/90 text-sm">
                        <i class="fa fa-refresh mr-1"></i> 重置本月签到数据
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        const ADMIN_PASSWORD = "868250"; 
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth();
        
        // 页面元素
        const studentPage = document.getElementById('studentPage');
        const adminLoginPage = document.getElementById('adminLoginPage');
        const adminPage = document.getElementById('adminPage');
        
        // 初始化函数
        function init() {
            // 确保数据结构正确初始化
            if (!localStorage.getItem('students')) {
                localStorage.setItem('students', JSON.stringify({}));
            }
            if (!localStorage.getItem('studentPasswords')) {
                localStorage.setItem('studentPasswords', JSON.stringify({}));
            }
            
            updateMonthDisplay();
            renderAttendanceTable();
            bindEvents();
        }
        
        // 更新月份显示
        function updateMonthDisplay() {
            document.getElementById('currentMonthDisplay').textContent = 
                `${currentYear}年${currentMonth + 1}月`;
        }
        
        // 获取当前月份的存储键名
        function getMonthKey() {
            return `attendance_${currentYear}_${currentMonth + 1}`;
        }
        
        // 渲染考勤表格
        function renderAttendanceTable() {
            const students = JSON.parse(localStorage.getItem('students') || '{}');
            const attendanceData = JSON.parse(localStorage.getItem(getMonthKey()) || '{}');
            const tbody = document.getElementById('attendanceTableBody');
            const emptyState = document.getElementById('emptyState');
            
            tbody.innerHTML = '';
            let signedCount = 0;
            const studentEntries = Object.entries(students);
            
            if (studentEntries.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                studentEntries.forEach(([studentId, studentName]) => {
                    const record = attendanceData[studentId] || { signed: false, time: '' };
                    if (record.signed) signedCount++;
                    
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="p-3 border-b font-mono text-sm">${studentId}</td>
                        <td class="p-3 border-b font-medium">${studentName}</td>
                        <td class="p-3 border-b">
                            ${record.signed ? 
                                '<span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-green-100 text-green-800"><i class="fa fa-check mr-1"></i>已签到</span>' : 
                                '<span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-gray-100 text-gray-600">未签到</span>'}
                        </td>
                        <td class="p-3 border-b text-sm text-gray-500">${record.time || '-'}</td>
                        <td class="p-3 border-b">
                            <button class="delete-student text-danger hover:text-red-700 transition-colors text-sm" data-id="${studentId}">
                                <i class="fa fa-trash mr-1"></i>删除
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            
            // 更新统计数字
            document.getElementById('signedCount').textContent = signedCount;
            document.getElementById('totalCount').textContent = studentEntries.length;
            
            // 绑定删除按钮事件
            document.querySelectorAll('.delete-student').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const students = JSON.parse(localStorage.getItem('students') || '{}');
                    const name = students[id];
                    if(confirm(`确定要删除学生 "${name} (${id})" 吗？\n这将清除其所有签到记录和设置的密码。`)) {
                        deleteStudent(id);
                    }
                });
            });
        }
        
        // 删除学生
        function deleteStudent(studentId) {
            // 1. 从学生列表中删除
            let students = JSON.parse(localStorage.getItem('students') || '{}');
            delete students[studentId];
            localStorage.setItem('students', JSON.stringify(students));
            
            // 2. 删除该学生的签到密码
            const studentPasswords = JSON.parse(localStorage.getItem('studentPasswords') || '{}');
            delete studentPasswords[studentId];
            localStorage.setItem('studentPasswords', JSON.stringify(studentPasswords));
            
            // 3. 从所有月份的考勤数据中删除该学生记录 (清理垃圾数据)
            for (let y = currentYear - 1; y <= currentYear + 1; y++) {
                for (let m = 1; m <= 12; m++) {
                    const key = `attendance_${y}_${m}`;
                    const data = JSON.parse(localStorage.getItem(key) || '{}');
                    if (data[studentId]) {
                        delete data[studentId];
                        localStorage.setItem(key, JSON.stringify(data));
                    }
                }
            }
            
            renderAttendanceTable();
        }
        
        // 绑定所有事件
        function bindEvents() {
            // 学号输入时实时验证并显示姓名
            document.getElementById('studentId').addEventListener('input', function() {
                const studentId = this.value.trim();
                const students = JSON.parse(localStorage.getItem('students') || '{}');
                const nameDisplay = document.getElementById('studentNameDisplay');
                const passwordSection = document.getElementById('passwordSection');
                
                if (studentId && students[studentId]) {
                    document.getElementById('showName').textContent = students[studentId];
                    nameDisplay.classList.remove('hidden');
                    // 如果之前已经输入过密码，保持密码框状态，否则隐藏
                    // 这里简单处理：只要没开始输密码，就先隐藏密码框，等点击签到再显示
                    if(document.getElementById('studentPassword').value === '') {
                         passwordSection.classList.add('hidden');
                    }
                } else {
                    nameDisplay.classList.add('hidden');
                    passwordSection.classList.add('hidden');
                }
            });
            
            // 页面切换
            document.getElementById('studentBtn').addEventListener('click', () => {
                studentPage.classList.remove('hidden');
                adminLoginPage.classList.add('hidden');
                adminPage.classList.add('hidden');
                // 重置学生页面状态
                document.getElementById('studentId').value = '';
                document.getElementById('studentPassword').value = '';
                document.getElementById('passwordSection').classList.add('hidden');
                document.getElementById('studentNameDisplay').classList.add('hidden');
                document.getElementById('signInResult').classList.add('hidden');
            });
            
            document.getElementById('adminBtn').addEventListener('click', () => {
                studentPage.classList.add('hidden');
                adminLoginPage.classList.remove('hidden');
                adminPage.classList.add('hidden');
                document.getElementById('adminPassword').value = '';
                document.getElementById('loginResult').classList.add('hidden');
            });
            
            // 管理员登录
            document.getElementById('adminLoginBtn').addEventListener('click', () => {
                const inputPwd = document.getElementById('adminPassword').value;
                const resultEl = document.getElementById('loginResult');
                
                if (inputPwd === ADMIN_PASSWORD) {
                    adminLoginPage.classList.add('hidden');
                    adminPage.classList.remove('hidden');
                    resultEl.classList.add('hidden');
                    renderAttendanceTable(); // 刷新数据
                } else {
                    resultEl.textContent = '密码错误，请重试';
                    resultEl.className = 'mt-6 p-4 rounded-lg bg-danger/10 text-danger text-center';
                    resultEl.classList.remove('hidden');
                }
            });
            
            // 学生签到逻辑
            document.getElementById('signInBtn').addEventListener('click', () => {
                const studentId = document.getElementById('studentId').value.trim();
                const password = document.getElementById('studentPassword').value.trim();
                const resultEl = document.getElementById('signInResult');
                const students = JSON.parse(localStorage.getItem('students') || '{}');
                
                // 1. 验证学号是否有效
                if (!studentId) {
                    showResult(resultEl, '请输入学号', 'warning');
                    return;
                }
                
                if (!students[studentId]) {
                    showResult(resultEl, '该学号无效或未分配，请联系管理员', 'danger');
                    document.getElementById('passwordSection').classList.add('hidden');
                    document.getElementById('studentNameDisplay').classList.add('hidden');
                    return;
                }
                
                const studentName = students[studentId];
                
                // 2. 检查是否已经签到过
                const attendanceData = JSON.parse(localStorage.getItem(getMonthKey()) || '{}');
                if (attendanceData[studentId]?.signed) {
                    showResult(resultEl, `你好 ${studentName}，你本月已完成签到`, 'warning');
                    document.getElementById('passwordSection').classList.add('hidden');
                    return;
                }
                
                // 3. 如果密码区域隐藏，先显示密码输入
                if (document.getElementById('passwordSection').classList.contains('hidden')) {
                    const studentPasswords = JSON.parse(localStorage.getItem('studentPasswords') || '{}');
                    if (!studentPasswords[studentId]) {
                        document.getElementById('passwordLabel').textContent = '初次签到，请设置6位数字密码';
                    } else {
                        document.getElementById('passwordLabel').textContent = '请输入你的6位数字密码确认签到';
                    }
                    document.getElementById('passwordSection').classList.remove('hidden');
                    document.getElementById('studentPassword').focus();
                    return;
                }
                
                // 4. 验证密码格式
                if (!/^\d{6}$/.test(password)) {
                    showResult(resultEl, '密码必须是6位数字', 'danger');
                    return;
                }
                
                // 5. 处理密码逻辑
                const studentPasswords = JSON.parse(localStorage.getItem('studentPasswords') || '{}');
                if (!studentPasswords[studentId]) {
                    // 初次签到，设置密码
                    studentPasswords[studentId] = password;
                    localStorage.setItem('studentPasswords', JSON.stringify(studentPasswords));
                } else {
                    // 验证已有密码
                    if (studentPasswords[studentId] !== password) {
                        showResult(resultEl, '密码错误，请重试', 'danger');
                        return;
                    }
                }
                
                // 6. 完成签到
                attendanceData[studentId] = {
                    signed: true,
                    time: new Date().toLocaleString()
                };
                localStorage.setItem(getMonthKey(), JSON.stringify(attendanceData));
                
                showResult(resultEl, `签到成功！${studentName} (${studentId})`, 'success');
                
                // 清空输入框并重置状态
                setTimeout(() => {
                    document.getElementById('studentId').value = '';
                    document.getElementById('studentPassword').value = '';
                    document.getElementById('passwordSection').classList.add('hidden');
                    document.getElementById('studentNameDisplay').classList.add('hidden');
                    resultEl.classList.add('hidden');
                }, 3000);
            });
            
            // 辅助函数：显示结果消息
            function showResult(el, msg, type) {
                el.textContent = msg;
                let colorClass = '';
                if (type === 'success') colorClass = 'bg-success/10 text-success';
                else if (type === 'warning') colorClass = 'bg-warning/10 text-warning';
                else colorClass = 'bg-danger/10 text-danger';
                
                el.className = `mt-6 p-4 rounded-lg ${colorClass}`;
                el.classList.remove('hidden');
            }
            
            // 添加学生
            document.getElementById('addStudentBtn').addEventListener('click', () => {
                const newIdInput = document.getElementById('newStudentId');
                const newNameInput = document.getElementById('newStudentName');
                const newId = newIdInput.value.trim();
                const newName = newNameInput.value.trim();
                
                if (!newId || !newName) {
                    alert('学号和姓名都不能为空');
                    return;
                }
                
                let students = JSON.parse(localStorage.getItem('students') || '{}');
                
                if (students[newId]) {
                    alert(`学号 ${newId} 已存在，对应学生为：${students[newId]}`);
                    return;
                }
                
                students[newId] = newName;
                localStorage.setItem('students', JSON.stringify(students));
                
                // 清空输入框并给出反馈
                newIdInput.value = '';
                newNameInput.value = '';
                alert(`学生 ${newName} (${newId}) 添加成功！`);
                renderAttendanceTable();
            });
            
            // 月份切换
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                updateMonthDisplay();
                renderAttendanceTable();
            });
            
            document.getElementById('nextMonth').addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                updateMonthDisplay();
                renderAttendanceTable();
            });
            
            // 重置本月数据
            document.getElementById('resetMonthBtn').addEventListener('click', () => {
                if (confirm('确定要重置本月所有签到数据吗？\n注意：这不会删除学生设置的密码，只会清除签到状态和时间。')) {
                    localStorage.removeItem(getMonthKey());
                    renderAttendanceTable();
                }
            });
        }
        
        // 启动系统
        init();
    </script>
</body>
</html>
